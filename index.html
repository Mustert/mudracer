<title>Mudracer</title>
<style>
  :root {
    --ground: #1d140e;
    --btn: rgba(255, 236, 200, .16);
    --btn-on: rgba(255, 236, 200, .42);
    --btn-edge: rgba(255, 236, 200, .5);
    --ink: #fff3dc;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #touch .b {
    position: fixed; width: 64px; height: 64px; box-sizing: border-box;
    border: 2px solid var(--btn-edge); border-radius: 12px; background: var(--btn);
    color: var(--ink); font: 14px "Press Start 2P", monospace;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  #touch .b.on { background: var(--btn-on); }
  /* menus: arrow cross on the left, OK on the right */
  #bu { left: 84px;  bottom: calc(152px + env(safe-area-inset-bottom, 0px)); }
  #bl { left: 16px;  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #br { left: 152px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #bd { left: 84px;  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #bh { right: 16px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 100px !important; height: 100px !important; border-radius: 50% !important; font-size: 12px !important; }
  #touch .std, #sz { display: none !important; }
  /* race, standard steering: steer with the left thumb, gas and brake with the right one */
  #touch[data-mode="std"] #bu, #touch[data-mode="std"] #bd { display: none; }
  #touch[data-mode="std"] .std { display: flex !important; }
  #touch[data-mode="std"] #bl, #touch[data-mode="std"] #br { width: 84px; height: 84px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); font-size: 20px; }
  #touch[data-mode="std"] #br { left: 112px; }
  #bg { right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 100px !important; height: 100px !important; border-radius: 50% !important; }
  #bb { right: 128px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); width: 72px !important; height: 72px !important; }
  #touch[data-mode="std"] #bh { width: 72px !important; height: 72px !important; bottom: calc(136px + env(safe-area-inset-bottom, 0px)); right: 30px; font-size: 10px !important; }
  /* race, alternative steering: a stick at the bottom left that moves to where the thumb lands */
  #touch[data-mode="stick"] #bu, #touch[data-mode="stick"] #bd, #touch[data-mode="stick"] #bl, #touch[data-mode="stick"] #br { display: none; }
  #touch[data-mode="stick"] #sz { display: block !important; }
  #sz { position: fixed; left: 0; bottom: 0; width: min(50vw, 440px); height: 75vh; touch-action: none; }
  #sb {
    position: fixed; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); width: 128px; height: 128px;
    box-sizing: border-box; border: 2px solid var(--btn-edge); border-radius: 50%; background: var(--btn); pointer-events: none;
  }
  #sk {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px;
    box-sizing: border-box; border: 2px solid var(--btn-edge); border-radius: 50%; background: var(--btn-on);
  }
  #sb.on #sk { background: var(--ink); }
  /* bug window (F8, src/bugreport.js) */
  #bug { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: rgba(27, 18, 12, .65); padding: 16px; }
  #bug[hidden] { display: none; }
  #bug .bugwin { width: min(560px, 100%); box-sizing: border-box; padding: 16px; background: #2a1c12; border: 3px solid #e8a860; border-radius: 6px; color: var(--ink); font: 10px/1.6 "Press Start 2P", monospace; user-select: text; -webkit-user-select: text; }
  #bug h2 { margin: 0 0 8px; font-size: 14px; font-weight: normal; color: #ffd23f; }
  #bug .bugmeta { color: #d8c4a8; margin-bottom: 8px; }
  #bug textarea { width: 100%; box-sizing: border-box; resize: vertical; padding: 8px; background: #1b120c; color: var(--ink); border: 2px solid #6b4e36; border-radius: 4px; font: 12px/1.5 system-ui, sans-serif; touch-action: auto; }
  #bug textarea:focus { outline: none; border-color: #e8a860; }
  #bug .bugrow { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 10px; flex-wrap: wrap; }
  #bug .bugrow.small { font-size: 8px; }
  #bug .bugmsg { flex: 1; color: #d8c4a8; }
  #bug button { font: inherit; padding: 8px 10px; background: #3a2a1c; color: var(--ink); border: 2px solid #6b4e36; border-radius: 4px; cursor: pointer; }
  #bug button:hover, #bug button:focus-visible { background: #e8a860; color: #1b120c; outline: none; }
  .bugflash { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 10; padding: 8px 12px; background: #2a1c12; border: 2px solid #e8a860; color: var(--ink); font: 8px "Press Start 2P", monospace; pointer-events: none; }
</style>

<div id="wrap"><canvas id="game" width="480" height="270" aria-label="Mudracer Spielfeld"></canvas></div>
<div id="touch" hidden data-mode="menu">
  <div class="b" id="bu" data-k="ArrowUp">&#9650;</div>
  <div class="b" id="bl" data-k="ArrowLeft">&#9664;</div>
  <div class="b" id="br" data-k="ArrowRight">&#9654;</div>
  <div class="b" id="bd" data-k="ArrowDown">&#9660;</div>
  <div class="b std" id="bb" data-k="ArrowDown">&#9660;</div>
  <div class="b std" id="bg" data-k="ArrowUp">GAS</div>
  <div id="sz"><div id="sb"><div id="sk"></div></div></div>
  <div class="b" id="bh" data-k=" ">OK</div>
</div>

<script type="module" src="/src/main.js"></script>
