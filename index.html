<title>Mudracer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --ground: #1d140e;
    --btn: rgba(255, 236, 200, .16);
    --btn-on: rgba(255, 236, 200, .42);
    --btn-edge: rgba(255, 236, 200, .5);
    --ink: #fff3dc;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: var(--ground); overflow: hidden; }
  body { touch-action: none; user-select: none; -webkit-user-select: none; }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  #touch .b {
    position: fixed; width: 64px; height: 64px; box-sizing: border-box;
    border: 2px solid var(--btn-edge); border-radius: 12px; background: var(--btn);
    color: var(--ink); font: 14px "Press Start 2P", monospace;
    display: flex; align-items: center; justify-content: center; touch-action: none;
  }
  #touch .b.on { background: var(--btn-on); }
  #bu { left: 84px;  bottom: calc(152px + env(safe-area-inset-bottom, 0px)); }
  #bl { left: 16px;  bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #br { left: 152px; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  #bd { left: 84px;  bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  #bh { right: 16px; bottom: calc(40px + env(safe-area-inset-bottom, 0px)); width: 100px !important; height: 100px !important; border-radius: 50% !important; font-size: 12px !important; }
</style>

<div id="wrap"><canvas id="game" width="480" height="270" aria-label="Mudracer Spielfeld"></canvas></div>
<div id="touch" hidden>
  <div class="b" id="bu" data-k="ArrowUp">&#9650;</div>
  <div class="b" id="bl" data-k="ArrowLeft">&#9664;</div>
  <div class="b" id="br" data-k="ArrowRight">&#9654;</div>
  <div class="b" id="bd" data-k="ArrowDown">&#9660;</div>
  <div class="b" id="bh" data-k=" ">OK</div>
</div>

<script>

const FONT = '"Press Start 2P", monospace';
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function fit() {
  const s = Math.min(innerWidth / VW, innerHeight / VH);
  const sc = s >= 3 ? Math.floor(s) : s;
  cv.style.width = Math.floor(VW * sc) + 'px';
  cv.style.height = Math.floor(VH * sc) + 'px';
}
addEventListener('resize', fit); fit();
if (document.fonts && document.fonts.load) document.fonts.load('16px "Press Start 2P"').catch(() => {});

// ---------- helpers ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const pick = a => a[(Math.random() * a.length) | 0];
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s | 0) + 1, 982451653)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, s) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function rng(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mk(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function toCanvas(img) { const c = mk(img.width, img.height); c.getContext('2d').putImageData(img, 0, 0); return c; }
function outlineImg(img, w, h, col) {
  const d = img.data, o = new Uint8ClampedArray(d);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = (y * w + x) * 4;
    if (d[i + 3]) continue;
    if ((x > 0 && d[i - 1]) || (x < w - 1 && d[i + 7]) || (y > 0 && d[i - w * 4 + 3]) || (y < h - 1 && d[i + w * 4 + 3])) {
      o[i] = col[0]; o[i + 1] = col[1]; o[i + 2] = col[2]; o[i + 3] = 255;
    }
  }
  return new ImageData(o, w, h);
}

  draw({ R, wheel, glass, cut }, c) {

CAR_DEFS.forEach((d, i) => { d.k = i; });
// What the player sees is a five-star view; the fine values behind it (speed, mud, acc, turn) do the real work.
// soil = share of top speed lost when fully muddy: cars that cope badly with mud pay for it until they wash.
const stars = (v, lo, hi) => clamp(1 + Math.round((v - lo) / (hi - lo) * 4), 1, 5);
[...CAR_DEFS, ...GENERICS].forEach(d => {
  d.tempo = stars(d.speed + .1 * (d.acc - 1), .94, 1.09); d.matsch = stars(d.mud, .8, 1.6);

function drawTitleScreen() {
