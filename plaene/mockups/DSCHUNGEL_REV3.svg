<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1150">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;fill:#1d2a12}
.t{font-size:24px}.s{font-size:18px;font-weight:600}.h{font-size:34px}
.n{fill:#c62828;stroke:#fff;stroke-width:3}
.nt{font-size:20px;fill:#fff;stroke:none;text-anchor:middle;dominant-baseline:central}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<!-- dense jungle everywhere (the thicket is the border) -->
<rect width="1700" height="1150" fill="#1f4a1c"/>
<g fill="#2a5e24"><circle cx="1350" cy="500" r="160"/><circle cx="450" cy="560" r="140"/><circle cx="1500" cy="950" r="130"/><circle cx="1000" cy="700" r="90"/></g>
<!-- table mountain -->
<path d="M0 0H1700V50Q1300 85 960 55Q880 85 800 55Q400 85 0 65Z" fill="#7a6a58"/>
<!-- river: waterfall, pool, gorge, deep middle, ford, out to the south -->
<path d="M865 0h30v60h-30z" fill="#cfeef4"/>
<path d="M850 60Q880 50 915 65L930 120Q960 160 950 230L990 330Q980 420 970 520Q975 700 950 820L960 1150H820L830 960Q800 820 810 700Q790 560 800 430L800 330Q820 260 830 230Q810 160 840 120Z" fill="#245652"/>
<!-- the river way: shallow bed below the pool -->
<path d="M835 240Q900 225 960 250L975 330Q900 345 815 335Z" fill="#64805a"/>
<g fill="#a0947a"><ellipse cx="870" cy="285" rx="16" ry="8"/><ellipse cx="925" cy="310" rx="14" ry="7"/></g>
<!-- the rock island in the gorge -->
<ellipse cx="882" cy="180" rx="26" ry="40" fill="#6a6458" stroke="#3e3a32" stroke-width="4"/>
<!-- road (thicket hugs it) -->
<g class="road">
<path d="M550 960H1180Q1280 960 1300 860Q1320 760 1450 740Q1580 720 1560 600Q1540 480 1400 470Q1260 460 1290 360Q1320 240 1200 200H300Q240 200 250 260L260 300H600L615 600L330 640L240 960Z" stroke="#163a14" stroke-width="96"/>
<path d="M550 960H1180Q1280 960 1300 860Q1320 760 1450 740Q1580 720 1560 600Q1540 480 1400 470Q1260 460 1290 360Q1320 240 1200 200H300Q240 200 250 260L260 300H600L615 600L330 640L240 960Z" stroke="#7a5a36" stroke-width="60"/>
<!-- river way branch -->
<path d="M1060 205Q1000 230 960 290Q880 330 820 300Q790 260 770 210" stroke="#8a7a52" stroke-width="40" stroke-dasharray="14 8"/>
</g>
<!-- lianas: three per gap -->
<g stroke="#3a6a1e" stroke-width="5"><path d="M850 110v58M850 110l-6 0"/><path d="M850 110v72" transform="translate(0,0)"/><path d="M912 110v70"/></g>
<g fill="#5aa83e"><circle cx="850" cy="160" r="5"/><circle cx="850" cy="185" r="5"/><circle cx="850" cy="210" r="5"/><circle cx="914" cy="160" r="5"/><circle cx="914" cy="185" r="5"/><circle cx="914" cy="210" r="5"/></g>
<!-- temple, stairs -->
<rect x="200" y="92" width="560" height="328" fill="#7a7a6a" stroke="#4a4a40" stroke-width="6"/>
<path d="M300 200H700M300 200V300H600V420" class="road" stroke="#d8c08a" stroke-width="44"/>
<path d="M440 305Q470 385 580 385L615 345" class="road" stroke="#c8ae76" stroke-width="26"/>
<circle cx="520" cy="382" r="14" fill="#9edcf0"/>
<!-- ford, ruin wall, camp -->
<rect x="820" y="925" width="140" height="70" fill="#64805a" opacity=".9"/>
<path d="M362 706H830" stroke="#9a9a88" stroke-width="16"/>
<g fill="#d8a040"><path d="M80 720l20-30 20 30z"/><path d="M120 760l20-30 20 30z"/></g>
<!-- start -->
<path d="M550 930v60" stroke="#fff" stroke-width="8" stroke-dasharray="8 8"/>
<!-- leaf tunnels on the east way -->
<g fill="#5aa83e" opacity=".85"><ellipse cx="1520" cy="640" rx="70" ry="55"/><ellipse cx="1300" cy="320" rx="60" ry="60"/></g>
<!-- labels -->
<g>
<circle class="n" cx="600" cy="905" r="18"/><text class="nt" x="600" y="905">1</text><text class="s" x="625" y="910">Start, Sumpf nur am Rand, kein Bohlenweg</text>
<circle class="n" cx="890" cy="1030" r="18"/><text class="nt" x="890" y="1030">2</text><text class="s" x="915" y="1035">Furt (kurz)</text>
<circle class="n" cx="1440" cy="830" r="18"/><text class="nt" x="1440" y="830">3</text><text class="s" x="1465" y="835">Ostweg durchs Dickicht</text>
<circle class="n" cx="1580" cy="660" r="18"/><text class="nt" x="1580" y="660">4</text><text class="s" x="1460" y="560">Laubtunnel (große Sicht)</text>
<circle class="n" cx="1080" cy="160" r="18"/><text class="nt" x="1080" y="160">5</text><text class="s" x="1000" y="125">Flussgabel, Wegweiser mit Bildern</text>
<circle class="n" cx="882" cy="180" r="18"/><text class="nt" x="882" y="180">6</text><text class="s" x="920" y="95">Lianensprung: Felsinsel, 2 × 3 Lianen</text>
<circle class="n" cx="900" cy="370" r="18"/><text class="nt" x="900" y="370">7</text><text class="s" x="925" y="375">Flussweg im Wasser, Krokodile</text>
<circle class="n" cx="480" cy="250" r="18"/><text class="nt" x="480" y="250">8</text><text class="s" x="215" y="80">Tempel: heller Sandsteinboden</text>
<text class="h" x="20" y="1130">DSCHUNGEL Rev 3 (Vorschlag)</text>
</g>
</svg>
