<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1700 1000">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;paint-order:stroke;stroke:#0b0d24;stroke-width:5px;stroke-linejoin:round;fill:#e8ecff}
.t{font-size:24px}.s{font-size:18px;font-weight:600}.h{font-size:34px}
.n{fill:#ffb300;stroke:#0b0d24;stroke-width:3}
.nt{font-size:20px;fill:#0b0d24;stroke:none;text-anchor:middle;dominant-baseline:central}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<pattern id="stars" width="140" height="140" patternUnits="userSpaceOnUse">
<circle cx="12" cy="20" r="1.6" fill="#fff"/><circle cx="80" cy="44" r="1" fill="#aab"/><circle cx="120" cy="100" r="1.8" fill="#fff"/><circle cx="40" cy="110" r="1.1" fill="#99a"/><circle cx="96" cy="8" r="1" fill="#fff"/><circle cx="60" cy="76" r="1.4" fill="#ccd"/>
</pattern>
<radialGradient id="planet" cx=".35" cy=".35"><stop offset="0" stop-color="#f3c27a"/><stop offset=".7" stop-color="#c06a3a"/><stop offset="1" stop-color="#6b2f1e"/></radialGradient>
<radialGradient id="hole"><stop offset=".25" stop-color="#000"/><stop offset=".45" stop-color="#7a3cff"/><stop offset=".7" stop-color="#1a0d40" stop-opacity=".6"/><stop offset="1" stop-color="#0b0d24" stop-opacity="0"/></radialGradient>
<radialGradient id="moon" cx=".45" cy=".3"><stop offset="0" stop-color="#d8d8d8"/><stop offset="1" stop-color="#7b7b84"/></radialGradient>
</defs>
<rect width="1700" height="1000" fill="#0b0d24"/>
<rect width="1700" height="1000" fill="url(#stars)"/>
<ellipse cx="900" cy="380" rx="260" ry="120" fill="#4a2a8a" opacity=".25"/>
<!-- moon -->
<circle cx="330" cy="1150" r="420" fill="url(#moon)"/>
<g fill="#6a6a72"><ellipse cx="470" cy="860" rx="70" ry="30"/><circle cx="200" cy="900" r="26"/><circle cx="330" cy="960" r="20"/></g>
<!-- station -->
<rect x="40" y="150" width="220" height="560" rx="24" fill="#3b4a66" stroke="#8fa6d0" stroke-width="4"/>
<circle cx="200" cy="105" r="70" fill="none" stroke="#8fa6d0" stroke-width="16"/>
<circle cx="200" cy="105" r="10" fill="#8fa6d0"/>
<!-- planet, ring field -->
<circle cx="1400" cy="430" r="250" fill="#b8d6ff" opacity=".22"/>
<circle cx="1400" cy="430" r="150" fill="#0b0d24"/>
<circle cx="1400" cy="430" r="120" fill="url(#planet)"/>
<g fill="#cfe6ff"><circle cx="1260" cy="330" r="10"/><circle cx="1560" cy="300" r="12"/><circle cx="1600" cy="520" r="9"/><circle cx="1300" cy="580" r="11"/><circle cx="1470" cy="640" r="10"/><circle cx="1230" cy="460" r="8"/></g>
<!-- belt -->
<rect x="700" y="650" width="600" height="250" rx="40" fill="#2b3350" opacity=".9"/>
<g fill="#6d5b4a" stroke="#3a2f25" stroke-width="4"><path d="M780 700q40-30 80 0q10 40-40 50q-50-10-40-50z"/><path d="M1000 860q50-40 100 0q-10 40-50 40q-50 0-50-40z"/><path d="M1150 700q30-25 70 0q0 40-35 40q-40 0-35-40z"/><circle cx="900" cy="880" r="22"/></g>
<g fill="#b9b9c4" opacity=".8"><ellipse cx="880" cy="720" rx="40" ry="14"/><ellipse cx="1100" cy="790" rx="40" ry="14"/></g>
<!-- black hole -->
<circle cx="600" cy="470" r="300" fill="none" stroke="#7a3cff" stroke-width="3" stroke-dasharray="10 10" opacity=".7"/>
<circle cx="600" cy="470" r="80" fill="url(#hole)"/>
<!-- road: platforms, around the planet, belt, moon -->
<g class="road" stroke="#c9d3e6" stroke-width="60">
<path d="M150 560L150 200Q150 150 200 140L520 70L700 140L860 150"/>
<path d="M1040 150L1200 150Q1400 130 1550 220Q1680 330 1660 500Q1630 680 1400 700L1300 760"/>
<path d="M1300 760L1100 790L900 760L700 800"/>
<path d="M700 800L560 800L380 840"/>
<path d="M260 860Q150 860 150 760L150 560"/>
</g>
<g class="road" stroke="#5c6880" stroke-width="44">
<path d="M150 560L150 200Q150 150 200 140L520 70L700 140L860 150"/>
<path d="M1040 150L1200 150Q1400 130 1550 220Q1680 330 1660 500Q1630 680 1400 700L1300 760"/>
<path d="M1300 760L1100 790L900 760L700 800"/>
<path d="M700 800L560 800L380 840"/>
<path d="M260 860Q150 860 150 760L150 560"/>
</g>
<!-- glass tube -->
<path d="M150 200Q150 150 200 140L520 70" stroke="#7fe3ff" stroke-width="66" fill="none" opacity=".25" stroke-linecap="round"/>
<!-- fork on the platforms: narrow grid bridge or wide platform -->
<path class="road" d="M860 150L1040 150" stroke="#ffd54a" stroke-width="22" stroke-dasharray="6 4"/>
<path class="road" d="M860 150Q950 290 1040 150" stroke="#5c6880" stroke-width="44"/>
<!-- inner line through the ring field -->
<path class="road" d="M1260 170Q1210 430 1330 640" stroke="#cfe6ff" stroke-width="6" stroke-dasharray="12 10"/>
<!-- crater jump -->
<path d="M380 840L260 860" stroke="#ff6d00" stroke-width="8" stroke-dasharray="4 8"/>
<path d="M380 840Q320 760 260 860" stroke="#ffcc80" stroke-width="4" fill="none" stroke-dasharray="6 6"/>
<!-- wormhole -->
<circle cx="900" cy="620" r="34" fill="#3b2a66" stroke="#ffd54a" stroke-width="4"/>
<circle cx="900" cy="620" r="18" fill="#b04aff"/>
<path d="M880 640Q720 700 575 780" stroke="#b04aff" stroke-width="4" fill="none" stroke-dasharray="10 8"/>
<circle cx="565" cy="785" r="14" fill="#2ee6d6"/>
<!-- decon bay -->
<path class="road" d="M150 900Q60 890 60 840L60 780Q60 740 150 740" stroke="#5c6880" stroke-width="34"/>
<g fill="#ffffff" opacity=".6"><circle cx="60" cy="800" r="18"/><circle cx="70" cy="830" r="14"/></g>
<!-- start -->
<rect x="122" y="556" width="56" height="8" fill="#fff"/>
<g fill="none" stroke="#fff" stroke-width="2" opacity=".85"><rect x="128" y="580" width="14" height="26"/><rect x="158" y="580" width="14" height="26"/><rect x="128" y="620" width="14" height="26"/><rect x="158" y="620" width="14" height="26"/><rect x="128" y="660" width="14" height="26"/><rect x="158" y="660" width="14" height="26"/></g>
<!-- numbers -->
<g><circle class="n" cx="95" cy="610" r="16"/><text class="nt" x="95" y="610">1</text></g>
<g><circle class="n" cx="330" cy="80" r="16"/><text class="nt" x="330" y="80">2</text></g>
<g><circle class="n" cx="760" cy="90" r="16"/><text class="nt" x="760" y="90">3</text></g>
<g><circle class="n" cx="1400" cy="270" r="16"/><text class="nt" x="1400" y="270">4</text></g>
<g><circle class="n" cx="1000" cy="940" r="16"/><text class="nt" x="1000" y="940">5</text></g>
<g><circle class="n" cx="955" cy="590" r="16"/><text class="nt" x="955" y="590">6</text></g>
<g><circle class="n" cx="650" cy="420" r="16"/><text class="nt" x="650" y="420">7</text></g>
<g><circle class="n" cx="330" cy="900" r="16"/><text class="nt" x="330" y="900">8</text></g>
<g><circle class="n" cx="30" cy="740" r="16"/><text class="nt" x="30" y="740">9</text></g>
<!-- labels -->
<text class="t" x="60" y="300">Station /</text><text class="t" x="60" y="328">Hangar</text>
<text class="s" x="300" y="130">Glasröhre</text>
<text class="t" x="560" y="40">Plattformen (schwerelos)</text>
<text class="s" x="880" y="125">Gitterbrücke</text><text class="s" x="880" y="260">breite Plattform</text>
<text class="t" x="1340" y="440">Planet</text>
<text class="s" x="1150" y="660">Ring (Feld) · innen = Swing-by</text>
<text class="t" x="860" y="690">Asteroidenfeld</text>
<text class="s" x="780" y="560">Wurmloch</text>
<text class="s" x="545" y="580">Schwarzes Loch (ab R2)</text>
<text class="s" x="420" y="760">Kratersprung</text>
<text class="t" x="260" y="980">Mond</text>
<text class="s" x="20" y="935">Deko-Bucht (W)</text>
<text class="s" x="190" y="560">Start / Ziel ↑</text>
<text class="h" x="1200" y="830">WELTALL Rev 2</text>
<text class="s" x="1200" y="860">Mockup zu plaene/WELTALL_REV2.md</text>
<text class="s" x="1200" y="885">1700 × 1000 · im Uhrzeigersinn</text>
<text class="s" x="1200" y="910">(W) = Waschen · gestrichelt = Wahlweg</text>
</svg>
