<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1000">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;fill:#2a2a5a}
.t{font-size:24px}.s{font-size:18px;font-weight:600}.h{font-size:34px}
.n{fill:#7b1fa2;stroke:#fff;stroke-width:3}
.nt{font-size:20px;fill:#fff;stroke:none;text-anchor:middle;dominant-baseline:central}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#bfe3ff"/><stop offset="1" stop-color="#e9f5ff"/></linearGradient>
<radialGradient id="gorge"><stop offset="0" stop-color="#6f7fa8"/><stop offset="1" stop-color="#6f7fa8" stop-opacity="0"/></radialGradient>
<g id="rb">
<path d="M200 540L200 300Q200 200 330 160"/>
<path d="M530 140L620 100Q720 60 815 80"/>
<path d="M885 80Q980 60 1080 100L1240 160"/>
<path d="M1460 220Q1600 300 1600 380"/>
<path d="M1600 560Q1600 700 1540 760"/>
<path d="M1340 860Q1150 900 1100 760Q1050 560 880 540Q720 540 740 720Q760 880 640 930L300 930Q200 930 200 820L200 660"/>
</g>
</defs>
<rect width="1800" height="1000" fill="url(#sky)"/>
<!-- cloud sea and the gorge in the middle -->
<g fill="#ffffff" opacity=".85"><circle cx="300" cy="700" r="90"/><circle cx="1000" cy="300" r="120"/><circle cx="1200" cy="700" r="100"/><circle cx="600" cy="350" r="110"/><circle cx="1650" cy="900" r="90"/><circle cx="800" cy="980" r="100"/></g>
<ellipse cx="900" cy="300" rx="260" ry="150" fill="url(#gorge)"/>
<g fill="#5a6488"><ellipse cx="560" cy="620" rx="40" ry="18"/><ellipse cx="1310" cy="330" rx="34" ry="16"/></g>
<!-- coins -->
<g stroke-width="10">
<circle cx="200" cy="520" r="130" fill="#f8bbd0" stroke="#ab47bc"/>
<circle cx="430" cy="150" r="110" fill="#d7a77a" stroke="#8d5524"/>
<circle cx="1350" cy="170" r="120" fill="#e0e0e0" stroke="#9e9e9e"/>
<circle cx="1600" cy="470" r="130" fill="#ffe082" stroke="#f9a825"/>
<circle cx="1450" cy="820" r="130" fill="#cfd8dc" stroke="#78909c"/>
</g>
<!-- rainbow road: six lanes, red on the left in driving direction (here simply outer to inner) -->
<g class="road">
<use href="#rb" stroke="#e53935" stroke-width="60"/>
<use href="#rb" stroke="#fb8c00" stroke-width="50"/>
<use href="#rb" stroke="#fdd835" stroke-width="40"/>
<use href="#rb" stroke="#43a047" stroke-width="30"/>
<use href="#rb" stroke="#1e88e5" stroke-width="20"/>
<use href="#rb" stroke="#8e24aa" stroke-width="10"/>
</g>
<!-- road across the coins (their own ground) -->
<g class="road" stroke="#8d6e63" stroke-width="44"><path d="M330 160Q430 130 530 140"/></g>
<g class="road" stroke="#b0bec5" stroke-width="44"><path d="M1240 160Q1350 140 1460 220"/></g>
<g class="road" stroke="#616161" stroke-width="44"><path d="M1600 380Q1640 470 1600 560"/></g>
<g class="road" stroke="#4e342e" stroke-width="44"><path d="M1540 760Q1450 820 1340 860"/></g>
<!-- gap at the top of the arch -->
<path d="M815 80L885 80" stroke="#bfe3ff" stroke-width="70"/>
<path d="M800 70Q850 20 900 70" stroke="#7b1fa2" stroke-width="4" fill="none" stroke-dasharray="8 6"/>
<!-- cloud path (fork 1) and double rainbow (last lap) -->
<path class="road" d="M1080 110Q1200 260 1360 250" stroke="#ffffff" stroke-width="34" stroke-dasharray="20 6"/>
<path class="road" d="M1340 860Q1000 960 640 930" stroke="#ff80ab" stroke-width="16" stroke-dasharray="14 10"/>
<!-- island landmarks -->
<g fill="#fff" stroke="#333" stroke-width="2"><ellipse cx="400" cy="120" rx="16" ry="10"/><ellipse cx="470" cy="135" rx="16" ry="10"/></g>
<ellipse cx="455" cy="190" rx="22" ry="12" fill="#6d4c41"/>
<rect x="360" y="215" width="70" height="10" fill="#c8a26a"/>
<ellipse cx="1350" cy="110" rx="34" ry="24" fill="#81d4fa"/>
<path d="M1300 210H1420" stroke="#d32f2f" stroke-width="6"/><path d="M1300 225H1420" stroke="#fff" stroke-width="10" stroke-dasharray="12 8"/>
<g fill="#e6c27a" stroke="#8d6e3a" stroke-width="3"><path d="M1560 455h28v-18h-28z"/><path d="M1612 455h28v-18h-28z"/></g>
<path d="M1560 520L1680 600" stroke="#455a64" stroke-width="4" stroke-dasharray="6 6"/>
<g fill="#455a64"><rect x="1600" y="545" width="14" height="10"/><rect x="1640" y="572" width="14" height="10"/></g>
<path d="M1420 780l40-60 40 60z" fill="#5d4037"/><path d="M1445 760h30" stroke="#ff6d00" stroke-width="6"/>
<path d="M1380 870Q1420 900 1450 880" stroke="#2f7a1e" stroke-width="6" fill="none"/>
<circle cx="1360" cy="770" r="14" fill="#b04aff" stroke="#ffd54a" stroke-width="3"/>
<!-- rain bay -->
<path class="road" d="M560 930Q560 985 500 985L460 985Q410 985 410 935" stroke="#90caf9" stroke-width="28"/>
<g fill="#78909c"><ellipse cx="485" cy="960" rx="40" ry="16"/></g><circle cx="520" cy="945" r="10" fill="#ffd54f"/>
<!-- podium, start -->
<g fill="#fff" stroke="#7b1fa2" stroke-width="3"><rect x="95" y="470" width="24" height="30"/><rect x="70" y="480" width="24" height="20"/><rect x="120" y="486" width="24" height="14"/></g>
<rect x="172" y="536" width="56" height="8" fill="#fff"/>
<g fill="none" stroke="#fff" stroke-width="2"><rect x="178" y="560" width="14" height="26"/><rect x="208" y="560" width="14" height="26"/><rect x="178" y="600" width="14" height="26"/><rect x="208" y="600" width="14" height="26"/><rect x="178" y="640" width="14" height="26"/><rect x="208" y="640" width="14" height="26"/></g>
<!-- numbers -->
<g><circle class="n" cx="270" cy="440" r="16"/><text class="nt" x="270" y="440">1</text></g>
<g><circle class="n" cx="430" cy="60" r="16"/><text class="nt" x="430" y="60">2</text></g>
<g><circle class="n" cx="700" cy="140" r="16"/><text class="nt" x="700" y="140">3</text></g>
<g><circle class="n" cx="1350" cy="40" r="16"/><text class="nt" x="1350" y="40">4</text></g>
<g><circle class="n" cx="1740" cy="470" r="16"/><text class="nt" x="1740" y="470">5</text></g>
<g><circle class="n" cx="1600" cy="830" r="16"/><text class="nt" x="1600" y="830">6</text></g>
<g><circle class="n" cx="940" cy="640" r="16"/><text class="nt" x="940" y="640">7</text></g>
<g><circle class="n" cx="600" cy="985" r="16"/><text class="nt" x="600" y="985">8</text></g>
<!-- labels -->
<text class="t" x="110" y="400">Fantasy</text>
<text class="s" x="350" y="250">Bronze: Kühe, Pfütze, Steg</text>
<text class="t" x="720" y="40">Regenbogen-Bogen</text><text class="s" x="790" y="125">Lücke (größter Sprung)</text>
<text class="s" x="1120" y="290">Wolkenpfad</text>
<text class="s" x="1280" y="300">Silber: Kois, Wolkenzug</text>
<text class="s" x="1530" y="640">Gold: Kerbs, Sphinx-Tor,</text><text class="s" x="1560" y="662">Sessellift</text>
<text class="s" x="1280" y="960">Platin: Lavaröhre, Liane, Wurmloch</text>
<text class="t" x="840" y="720">Spirale</text>
<text class="s" x="830" y="900">doppelter Regenbogen (letzte Runde)</text>
<text class="t" x="780" y="320">Wolkenschlucht</text>
<text class="s" x="620" y="1000" dy="-4">Regen-Bucht (W)</text>
<text class="s" x="40" y="460">Podest</text>
<text class="s" x="230" y="540">Start / Ziel ↑</text>
<text class="h" x="360" y="490">REGENBOGEN Rev 2</text>
<text class="s" x="360" y="518">Mockup zu plaene/REGENBOGEN_REV2.md</text>
<text class="s" x="360" y="542">1800 × 1000 · im Uhrzeigersinn</text>
<text class="s" x="360" y="566">gestrichelt = Wahlweg · (W) = Waschen</text>
</svg>
