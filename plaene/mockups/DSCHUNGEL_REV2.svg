<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;fill:#1d2a12}
.t{font-size:24px}.s{font-size:18px;font-weight:600}.h{font-size:34px}
