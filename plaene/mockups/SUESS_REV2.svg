<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000">
<style>
text{font-family:'Segoe UI',Arial,sans-serif;font-weight:700;paint-order:stroke;stroke:#fff;stroke-width:5px;stroke-linejoin:round;fill:#5a1f3a}
.t{font-size:24px}.s{font-size:18px;font-weight:600}.h{font-size:34px}
.n{fill:#d81b60;stroke:#fff;stroke-width:3}
.nt{font-size:20px;fill:#fff;stroke:none;text-anchor:middle;dominant-baseline:central}
.road{fill:none;stroke-linecap:round;stroke-linejoin:round}
</style>
<defs>
<pattern id="sprinkles" width="60" height="60" patternUnits="userSpaceOnUse">
<rect width="60" height="60" fill="#f9cfe0"/><rect x="8" y="10" width="8" height="3" fill="#4fc3f7" transform="rotate(30 12 11)"/><rect x="38" y="20" width="8" height="3" fill="#ffd54f"/><rect x="20" y="42" width="8" height="3" fill="#81c784" transform="rotate(-40 24 43)"/><rect x="46" y="48" width="8" height="3" fill="#e57373"/>
</pattern>
<radialGradient id="mtn" cx=".45" cy=".4"><stop offset="0" stop-color="#8d5a3b"/><stop offset="1" stop-color="#4e2a17"/></radialGradient>
</defs>
<rect width="1500" height="1000" fill="#fbe3ee"/>
<!-- lollipop forest field -->
<path d="M60 130Q300 100 520 140L520 620Q300 640 60 620Z" fill="url(#sprinkles)"/>
<!-- caramel moor -->
<ellipse cx="500" cy="100" rx="240" ry="80" fill="#e0a43a"/>
<!-- chocolate mountain -->
<circle cx="1000" cy="160" r="170" fill="url(#mtn)"/>
<circle cx="1000" cy="150" r="30" fill="#f5e6d0" stroke="#6d3a1e" stroke-width="5"/>
<!-- chocolate river: source, cascades, lake, out to the south -->
<path d="M1000 160Q990 260 960 330Q900 420 860 470" stroke="#5a2e14" stroke-width="40" fill="none"/>
<ellipse cx="780" cy="530" rx="210" ry="120" fill="#5a2e14"/>
<path d="M820 640Q840 800 860 1000" stroke="#5a2e14" stroke-width="70" fill="none"/>
<!-- rills of the event -->
<g stroke="#7b3f1e" stroke-width="6" stroke-dasharray="4 8" fill="none" opacity=".8"><path d="M960 140Q880 170 820 220"/><path d="M1060 200Q1120 300 1200 420"/><path d="M880 180Q600 300 420 420"/></g>
<!-- factory -->
<rect x="1150" y="420" width="300" height="440" rx="10" fill="#c5cae9" stroke="#5c6bc0" stroke-width="6"/>
<g fill="#9fa8da"><rect x="1180" y="470" width="80" height="16"/><rect x="1180" y="560" width="80" height="16"/><rect x="1180" y="650" width="80" height="16"/></g>
<!-- caramel brooks across the forest, trampolines -->
<g stroke="#d9952a" stroke-width="22" fill="none" stroke-linecap="round"><path d="M200 300Q320 290 470 250"/><path d="M70 440Q200 420 330 470"/></g>
<g fill="#ef5350" stroke="#8e1b1b" stroke-width="3"><ellipse cx="335" cy="335" rx="22" ry="12"/><ellipse cx="170" cy="505" rx="22" ry="12"/></g>
<!-- lollipops -->
<g><circle cx="250" cy="200" r="16" fill="#ff7eb3"/><circle cx="380" cy="350" r="16" fill="#81d4fa"/><circle cx="300" cy="520" r="16" fill="#ffd54f"/><circle cx="440" cy="230" r="16" fill="#a5d6a7"/><circle cx="210" cy="580" r="16" fill="#ce93d8"/></g>
<!-- roads (liquorice) -->
<g class="road" stroke="#111" stroke-width="58">
<path d="M120 640L120 560Q120 510 210 470Q390 390 310 270Q240 170 260 125Q280 95 340 95L700 95Q780 95 860 200L930 290Q960 320 1020 315L1150 320Q1250 330 1260 420"/>
<path d="M1300 860Q1300 910 1240 910L180 910Q120 910 120 850L120 640"/>
</g>
<g class="road" stroke="#2b2b2b" stroke-width="48">
<path d="M120 640L120 560Q120 510 210 470Q390 390 310 270Q240 170 260 125Q280 95 340 95L700 95Q780 95 860 200L930 290Q960 320 1020 315L1150 320Q1250 330 1260 420"/>
<path d="M1300 860Q1300 910 1240 910L180 910Q120 910 120 850L120 640"/>
</g>
<g class="road" stroke="#fff" stroke-width="3" stroke-dasharray="14 14">
<path d="M120 640L120 560Q120 510 210 470Q390 390 310 270Q240 170 260 125Q280 95 340 95L700 95Q780 95 860 200L930 290Q960 320 1020 315L1150 320Q1250 330 1260 420"/>
<path d="M1300 860Q1300 910 1240 910L180 910Q120 910 120 850L120 640"/>
</g>
<!-- cookie path through the moor (short) vs crisp lane (long) -->
<path class="road" d="M330 95L680 95" stroke="#d7a86e" stroke-width="20" stroke-dasharray="18 4"/>
<path class="road" d="M320 110Q500 220 690 110" stroke="#b07d4a" stroke-width="22"/>
<!-- candyfloss walls on the pass -->
<g fill="#ffc1e3" opacity=".9"><circle cx="800" cy="120" r="26"/><circle cx="860" cy="150" r="24"/><circle cx="830" cy="250" r="26"/><circle cx="900" cy="330" r="24"/></g>
<!-- waffle bridge and marshmallow stones -->
<rect x="935" y="292" width="60" height="44" fill="#e9b46a" stroke="#8a5a20" stroke-width="3"/>
<g fill="#fff" stroke="#e0c8d8" stroke-width="3"><circle cx="925" cy="370" r="10"/><circle cx="950" cy="385" r="10"/><circle cx="975" cy="372" r="10"/></g>
<!-- inside the factory: fast belt with press, service corridor -->
<path class="road" d="M1260 420Q1330 520 1330 640L1330 860" stroke="#7986cb" stroke-width="40"/>
<path class="road" d="M1260 420Q1210 520 1215 640Q1220 800 1300 860" stroke="#9e9e9e" stroke-width="28" stroke-dasharray="10 6"/>
<g stroke="#e8eaf6" stroke-width="3"><path d="M1315 560l15-12 15 12M1315 620l15-12 15 12M1315 720l15-12 15 12"/></g>
<rect x="1300" y="660" width="60" height="30" fill="#455a64"/>
<!-- crisp bridge, fizz field, gum -->
<rect x="815" y="880" width="80" height="60" fill="#c28a3c" stroke="#6d4a1a" stroke-width="3"/>
<g fill="#80deea" stroke="#00838f" stroke-width="2"><path d="M600 895l20-14v28z"/><path d="M420 895l20-14v28z"/></g>
<g fill="#f48fb1"><circle cx="650" cy="925" r="14"/><circle cx="470" cy="925" r="14"/></g>
<!-- lemonade bay -->
<path class="road" d="M330 910Q330 970 270 970L230 970Q180 970 180 915" stroke="#fff59d" stroke-width="30"/>
<circle cx="255" cy="968" r="16" fill="#ffee58" stroke="#f9a825" stroke-width="3"/>
<!-- gingerbread village -->
<g fill="#a0522d" stroke="#fff" stroke-width="3"><rect x="20" y="660" width="60" height="50"/><rect x="20" y="740" width="60" height="50"/></g>
<!-- start -->
<rect x="92" y="636" width="56" height="8" fill="#fff"/>
<g fill="none" stroke="#fff" stroke-width="2"><rect x="98" y="660" width="14" height="26"/><rect x="128" y="660" width="14" height="26"/><rect x="98" y="700" width="14" height="26"/><rect x="128" y="700" width="14" height="26"/><rect x="98" y="740" width="14" height="26"/><rect x="128" y="740" width="14" height="26"/></g>
<!-- numbers -->
<g><circle class="n" cx="170" cy="700" r="16"/><text class="nt" x="170" y="700">1</text></g>
<g><circle class="n" cx="330" cy="420" r="16"/><text class="nt" x="330" y="420">2</text></g>
<g><circle class="n" cx="500" cy="40" r="16"/><text class="nt" x="500" y="40">3</text></g>
<g><circle class="n" cx="780" cy="270" r="16"/><text class="nt" x="780" y="270">4</text></g>
<g><circle class="n" cx="1060" cy="380" r="16"/><text class="nt" x="1060" y="380">5</text></g>
<g><circle class="n" cx="1400" cy="440" r="16"/><text class="nt" x="1400" y="440">6</text></g>
<g><circle class="n" cx="560" cy="860" r="16"/><text class="nt" x="560" y="860">7</text></g>
<g><circle class="n" cx="350" cy="975" r="16"/><text class="nt" x="350" y="975">8</text></g>
<!-- labels -->
<text class="t" x="170" y="380">Lollipop-Wald (Feld)</text>
<text class="s" x="190" y="250">Karamellbach + Trampolin</text>
<text class="t" x="390" y="160">Karamellmoor</text><text class="s" x="350" y="80">Keksweg</text>
<text class="s" x="700" y="200">Zuckerwatte-</text><text class="s" x="700" y="222">Pass ↗</text>
<text class="t" x="1040" y="70">Schokoberg</text><text class="s" x="1040" y="150">Brunnen</text>
<text class="s" x="995" y="290">Waffelbrücke</text><text class="s" x="860" y="420">Marshmallows</text>
<text class="t" x="680" y="540">Schokosee</text>
<text class="t" x="1170" y="410">Bonbonfabrik</text>
<text class="s" x="1340" y="610">Fließband</text><text class="s" x="1365" y="700">Presse</text><text class="s" x="1080" y="760">Wartungsgang</text>
<text class="s" x="800" y="980">Krokantbrücke</text>
<text class="s" x="420" y="870">Brausefeld</text>
<text class="s" x="20" y="645">Lebkuchendorf</text>
<text class="s" x="380" y="1000" dy="-4">Limo-Bucht (W)</text>
<text class="s" x="150" y="625">Start / Ziel ↑</text>
<text class="h" x="230" y="720">SUESS Rev 2</text>
<text class="s" x="230" y="748">Mockup zu plaene/SUESS_REV2.md</text>
<text class="s" x="230" y="772">1500 × 1000 · im Uhrzeigersinn · (W) = Waschen</text>
<text class="s" x="1080" y="980">gepunktet = Schoko-Rinnen (ab R2)</text>
</svg>
